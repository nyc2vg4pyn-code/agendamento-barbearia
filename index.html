<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biel do Corte - Agendamento</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans flex flex-col items-center p-4">
  <main class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl my-6">
    <div class="text-center mb-5">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-amber-500/10 text-amber-500 rounded-full mb-3 text-2xl border border-amber-500/20">
        <i class="fa-solid fa-scissors"></i>
      </div>
      <h1 class="text-2xl font-black tracking-tight text-white uppercase">Biel do Corte</h1>
      <p class="text-xs text-zinc-400 mt-1">Agenda de Quarta a Sábado • Almoço das 12h às 13h</p>
    </div>

    <div class="bg-amber-500/10 border border-amber-500/30 rounded-xl p-3 mb-5 flex items-start gap-2.5">
      <i class="fa-solid fa-circle-info text-amber-500 mt-0.5 text-sm"></i>
      <div class="text-xs text-zinc-300 leading-relaxed">
        <strong class="text-amber-400 uppercase font-bold block mb-0.5">Atenção ao agendar:</strong>
        Escolha um horário disponível. Depois de enviar o agendamento pelo WhatsApp, o horário será registrado na agenda e ficará bloqueado quando a lista for atualizada.
      </div>
    </div>

    <form id="bookingForm" class="space-y-4">
      <div>
        <label for="clientName" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Seu Nome</label>
        <input type="text" id="clientName" required placeholder="Ex: João da Silva"
          class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition" />
      </div>

      <div>
        <label for="clientPhone" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Seu Telefone / WhatsApp</label>
        <input type="tel" id="clientPhone" required placeholder="(32) 99999-9999"
          class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition" />
      </div>

      <div>
        <label for="serviceSelect" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Tipo de Serviço</label>
        <select id="serviceSelect" required class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition">
          <option value="Corte de Cabelo">Corte de Cabelo</option>
          <option value="Barba">Barba</option>
          <option value="Combo Cabelo + Barba">Combo Cabelo + Barba</option>
          <option value="Sobrancelha">Sobrancelha</option>
          <option value="Cabelo + Sobrancelha">Cabelo + Sobrancelha</option>
        </select>
      </div>

      <div>
        <label for="bookingDate" class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Data do Agendamento</label>
        <input type="date" id="bookingDate" required class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-green-500 focus:ring-1 focus:ring-green-500 transition" />
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Horário Desejado</label>
        <div id="slotsContainer" class="grid grid-cols-3 gap-2 mt-2"></div>
        <input type="hidden" id="selectedTime" required />
      </div>

      <p id="statusMessage" class="hidden text-sm rounded-xl p-3" role="status" aria-live="polite"></p>

      <button type="submit" id="submitBtn" class="w-full mt-6 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition duration-200 shadow-lg shadow-amber-500/20 active:scale-[0.99]">
        <i class="fa-brands fa-whatsapp text-lg"></i>
        <span>Agendar e Enviar no WhatsApp</span>
      </button>
    </form>
  </main>

  <script>
    // CONFIGURE ESTES DOIS CAMPOS ANTES DE PUBLICAR
    const BARBER_WHATSAPP = "5532999996312"; // Número do Biel com código do país, somente números
    const GOOGLE_SHEETS_URL = "https://script.google.com/macros/s/AKfycbxKoKCz0ywvjVSAzITK82x6ob7P2QU-aEpsgQHze0zOrGR0U9iwFwVpTxMqtaZKV08n/exec"; // URL do Web App publicado

    const HORARIOS_OFICIAIS = {
      3: ["08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "13:00", "13:30", "14:00", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00"],
      4: ["07:00", "07:30", "08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30"],
      5: ["07:00", "07:30", "08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00", "16:30", "17:00", "17:30", "18:00", "18:30", "19:00", "19:30", "20:00"],
      6: ["07:00", "07:30", "08:00", "08:30", "09:00", "09:30", "10:00", "10:30", "11:00", "11:30", "13:00", "13:30", "14:00", "14:30", "15:00", "15:30", "16:00"]
    };
    const DIAS_NOMES = { 3: "Quarta-feira", 4: "Quinta-feira", 5: "Sexta-feira", 6: "Sábado" };

    const dateInput = document.getElementById("bookingDate");
    const slotsContainer = document.getElementById("slotsContainer");
    const selectedTimeInput = document.getElementById("selectedTime");
    const phoneInput = document.getElementById("clientPhone");
    const statusMessage = document.getElementById("statusMessage");
    const submitBtn = document.getElementById("submitBtn");
    const form = document.getElementById("bookingForm");

    // Usa a data local, evitando problemas de fuso horário de toISOString().
    function localDateString(date = new Date()) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }
    dateInput.min = localDateString();
    dateInput.value = localDateString();

    phoneInput.addEventListener("input", (e) => {
      const digits = e.target.value.replace(/\D/g, "").slice(0, 11);
      if (digits.length <= 2) e.target.value = digits ? `(${digits}` : "";
      else if (digits.length <= 7) e.target.value = `(${digits.slice(0,2)}) ${digits.slice(2)}`;
      else e.target.value = `(${digits.slice(0,2)}) ${digits.slice(2,7)}-${digits.slice(7)}`;
    });

    function showStatus(message, type = "info") {
      statusMessage.textContent = message;
      statusMessage.className = "text-sm rounded-xl p-3 " + (
        type === "error" ? "bg-red-500/10 border border-red-500/30 text-red-300" :
        type === "success" ? "bg-green-500/10 border border-green-500/30 text-green-300" :
        "bg-zinc-800 border border-zinc-700 text-zinc-300"
      );
    }

    function formatDate(dateValue) {
      const [year, month, day] = dateValue.split("-");
      return `${day}/${month}/${year}`;
    }

    async function buscarHorariosOcupados(dataFormatada) {
      if (!GOOGLE_SHEETS_URL || GOOGLE_SHEETS_URL.includes("https://script.google.com/macros/s/AKfycbxKoKCz0ywvjVSAzITK82x6ob7P2QU-aEpsgQHze0zOrGR0U9iwFwVpTxMqtaZKV08n/exec")) {
        throw new Error("O sistema ainda não está conectado à planilha. Configure a URL do Apps Script.");
      }
      const url = `${GOOGLE_SHEETS_URL}?data=${encodeURIComponent(dataFormatada)}&t=${Date.now()}`;
      const response = await fetch(url, { method: "GET", redirect: "follow", cache: "no-store" });
      if (!response.ok) throw new Error("Não foi possível consultar a agenda.");
      const result = await response.json();
      if (!Array.isArray(result.ocupados)) throw new Error("A resposta da planilha está em formato inesperado.");
      return result.ocupados;
    }

    function createSlotButton(hour, occupied) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.hour = hour;

      if (occupied) {
        btn.disabled = true;
        btn.setAttribute("aria-label", `${hour}, horário ocupado`);
        btn.innerHTML = `<span>${hour}</span><span class="block text-[10px] text-zinc-500 font-normal no-underline">Ocupado</span>`;
        btn.className = "py-2 px-1 text-xs font-semibold rounded-lg border border-zinc-800 bg-zinc-900/80 text-zinc-600 cursor-not-allowed opacity-60";
      } else {
        btn.textContent = hour;
        btn.className = "py-2 px-3 text-sm font-medium rounded-lg border border-green-600/40 bg-zinc-800/80 text-green-400 hover:bg-green-600/20 hover:border-green-500 transition cursor-pointer";
        btn.addEventListener("click", () => {
          document.querySelectorAll("#slotsContainer button:not(:disabled)").forEach(button => {
            button.className = "py-2 px-3 text-sm font-medium rounded-lg border border-green-600/40 bg-zinc-800/80 text-green-400 hover:bg-green-600/20 hover:border-green-500 transition cursor-pointer";
          });
          btn.className = "py-2 px-3 text-sm font-bold rounded-lg border border-green-500 bg-green-500 text-zinc-950 transition shadow-md shadow-green-500/20";
          selectedTimeInput.value = hour;
        });
      }
      return btn;
    }

    async function renderSlots() {
      selectedTimeInput.value = "";
      const value = dateInput.value;
      if (!value) {
        slotsContainer.innerHTML = "";
        return;
      }

      const selectedDate = new Date(`${value}T12:00:00`);
      const dayOfWeek = selectedDate.getDay();
      const horarios = HORARIOS_OFICIAIS[dayOfWeek];

      if (!horarios) {
        slotsContainer.innerHTML = `<div class="col-span-3 py-4 text-center text-amber-500/90 text-sm font-medium bg-amber-500/10 rounded-xl border border-amber-500/20">💈 Barbearia fechada neste dia.</div>`;
        return;
      }

      slotsContainer.innerHTML = `<div class="col-span-3 py-3 text-center text-xs text-zinc-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i> Consultando horários...</div>`;
      try {
        const ocupados = await buscarHorariosOcupados(formatDate(value));
        // Se o usuário mudou a data durante a consulta, ignora a resposta antiga.
        if (dateInput.value !== value) return;
        slotsContainer.innerHTML = "";
        horarios.forEach(hour => slotsContainer.appendChild(createSlotButton(hour, ocupados.includes(hour))));
        if (ocupados.length) showStatus("Os horários cinza já estão ocupados e não podem ser selecionados.", "info");
        else {
          statusMessage.className = "hidden text-sm rounded-xl p-3";
        }
      } catch (error) {
        slotsContainer.innerHTML = `<div class="col-span-3 py-3 text-center text-sm text-red-300 bg-red-500/10 border border-red-500/30 rounded-xl">Não foi possível carregar a agenda. Atualize a página ou tente novamente.</div>`;
        showStatus(error.message || "Falha ao consultar os horários. Nenhum horário foi liberado para seleção.", "error");
      }
    }

    dateInput.addEventListener("change", renderSlots);

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const time = selectedTimeInput.value;
      if (!time) {
        showStatus("Selecione um horário verde disponível.", "error");
        return;
      }
      if (!GOOGLE_SHEETS_URL || GOOGLE_SHEETS_URL.includes("COLE_A_URL")) {
        showStatus("O sistema ainda não está conectado à planilha. Configure a URL do Apps Script.", "error");
        return;
      }

      const name = document.getElementById("clientName").value.trim();
      const phone = phoneInput.value.trim();
      const service = document.getElementById("serviceSelect").value;
      const dateValue = dateInput.value;
      const dateFormatted = formatDate(dateValue);
      const selectedDate = new Date(`${dateValue}T12:00:00`);
      const dayName = DIAS_NOMES[selectedDate.getDay()] || "";

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i><span>Registrando agendamento...</span>`;

      try {
        // Reconsulta antes de gravar para evitar reservar um horário que acabou de ser ocupado.
        const occupiedNow = await buscarHorariosOcupados(dateFormatted);
        if (occupiedNow.includes(time)) {
          showStatus("Esse horário acabou de ser reservado por outra pessoa. Escolha outro horário.", "error");
          await renderSlots();
          return;
        }

        const payload = {
          nome: name,
          telefone: phone,
          servico: service,
          data: dateFormatted,
          dataISO: dateValue,
          diaSemana: dayName,
          horario: time
        };

        // O Apps Script aceita este POST simples; o servidor também verifica duplicidade com LockService.
        await fetch(GOOGLE_SHEETS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        // O WhatsApp recebe os dados do agendamento.
        const message = `💈 *AGENDAMENTO – BIEL DO CORTE* 💈\n\n` +
          `👤 *Nome:* ${name}\n📱 *Telefone:* ${phone}\n✂️ *Serviço:* ${service}\n` +
          `🗓️ *Data:* ${dayName} (${dateFormatted})\n⏰ *Horário:* ${time}\n\n` +
          `Agendamento enviado pelo aplicativo.`;
        const whatsappUrl = `https://wa.me/${BARBER_WHATSAPP}?text=${encodeURIComponent(message)}`;

        // Bloqueio visual imediato nesta tela; as outras telas serão atualizadas consultando a planilha.
        const chosenButton = [...slotsContainer.querySelectorAll("button")].find(button => button.dataset.hour === time);
        if (chosenButton) {
          chosenButton.disabled = true;
          chosenButton.className = "py-2 px-1 text-xs font-semibold rounded-lg border border-zinc-800 bg-zinc-900/80 text-zinc-600 cursor-not-allowed opacity-60";
          chosenButton.textContent = `${time} • Ocupado`;
        }
        selectedTimeInput.value = "";
        showStatus("Solicitação enviada. O WhatsApp será aberto com os dados do agendamento. A lista é atualizada pela planilha.", "success");
        window.open(whatsappUrl, "_blank", "noopener");
        // Dá um pequeno intervalo para o Apps Script gravar antes de consultar novamente.
        setTimeout(renderSlots, 1500);
      } catch (error) {
        showStatus("Não foi possível enviar o agendamento. Tente novamente.", "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<i class="fa-brands fa-whatsapp text-lg"></i><span>Agendar e Enviar no WhatsApp</span>`;
      }
    });

    renderSlots();
  </script>
</body>
</html>
