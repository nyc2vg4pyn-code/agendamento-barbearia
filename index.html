<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agendamento - Barbearia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans flex flex-col items-center p-4">

  <main class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-6 shadow-2xl my-6">
    <!-- Cabeçalho -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-amber-500/10 text-amber-500 rounded-full mb-3 text-2xl">
        <i class="fa-solid fa-scissors"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Barbearia do Irmão</h1>
      <p class="text-sm text-zinc-400 mt-1">Escolha o serviço, data e o melhor horário</p>
    </div>

    <form id="bookingForm" class="space-y-4">
      <!-- 1. Nome -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Seu Nome</label>
        <input type="text" id="clientName" required placeholder="Ex: João Silva"
          class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition" />
      </div>

      <!-- 2. WhatsApp -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Seu WhatsApp</label>
        <input type="tel" id="clientPhone" required placeholder="(99) 99999-9999"
          class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-4 py-3 text-white placeholder-zinc-500 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition" />
      </div>

      <!-- 3. Serviço -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Serviço</label>
        <select id="serviceSelect" required
          class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
          <option value="Corte de Cabelo (R$ 35)">Corte de Cabelo — R$ 35</option>
          <option value="Barba (R$ 15)">Barba Terapia — R$ 15</option>
          <option value="Combo Cabelo + Barba (R$ 45)">Combo Cabelo + Barba — R$ 45</option>
          <option value="Sobrancelha (R$ 10)">Sobrancelha — R$ 10</option>
        </select>
      </div>

      <!-- 4. Data -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Data</label>
        <input type="date" id="bookingDate" required
          class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition" />
      </div>

      <!-- 5. Horário -->
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-1">Horário</label>
        <div id="slotsContainer" class="grid grid-cols-3 gap-2 mt-2">
          <!-- Gerado via JavaScript -->
        </div>
        <input type="hidden" id="selectedTime" required />
      </div>

      <!-- Botão de Confirmação -->
      <button type="submit"
        class="w-full mt-6 bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 transition duration-200 shadow-lg shadow-amber-500/20 active:scale-[0.99]">
        <i class="fa-brands fa-whatsapp text-lg"></i>
        <span>Agendar via WhatsApp</span>
      </button>
    </form>
  </main>

  <script>
    // CONFIGURAÇÃO: Coloque aqui o DDD + Telefone do seu irmão (só números)
    const BARBER_WHATSAPP = "5532999996312"; 

    // Horários de atendimento disponíveis
    const DEFAULT_HOURS = [
      "07:00", "07:30", "08:00", "08:30", "09:00", "09:30", "10:30", "11:00",
      "11:30", "13:30", "14:15", "15:00", "15:45",
      "16:30", "17:15", "18:00", "18:45", "19:45"
    ];

    const dateInput = document.getElementById("bookingDate");
    const slotsContainer = document.getElementById("slotsContainer");
    const selectedTimeInput = document.getElementById("selectedTime");
    const phoneInput = document.getElementById("clientPhone");

    // Limita a data mínima para hoje
    const today = new Date().toISOString().split("T")[0];
    dateInput.min = today;
    dateInput.value = today;

    // Máscara simples de telefone
    phoneInput.addEventListener("input", (e) => {
      let x = e.target.value.replace(/\D/g, "").match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
      e.target.value = !x[2] ? x[1] : `(${x[1]}) ${x[2]}` + (x[3] ? `-${x[3]}` : "");
    });

    // Renderizar blocos de horários
    function renderSlots() {
      slotsContainer.innerHTML = "";
      selectedTimeInput.value = "";

      DEFAULT_HOURS.forEach((hour) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = hour;
        btn.className = "py-2 px-3 text-sm font-medium rounded-lg border border-zinc-700 bg-zinc-800 text-zinc-300 hover:border-amber-500/50 hover:text-white transition";

        btn.onclick = () => {
          document.querySelectorAll("#slotsContainer button").forEach(b => {
            b.className = "py-2 px-3 text-sm font-medium rounded-lg border border-zinc-700 bg-zinc-800 text-zinc-300 hover:border-amber-500/50 hover:text-white transition";
          });
          btn.className = "py-2 px-3 text-sm font-bold rounded-lg border border-amber-500 bg-amber-500 text-zinc-950 transition shadow-md shadow-amber-500/20";
          selectedTimeInput.value = hour;
        };

        slotsContainer.appendChild(btn);
      });
    }

    renderSlots();

    // Envio do Formulário -> WhatsApp
    document.getElementById("bookingForm").addEventListener("submit", (e) => {
      e.preventDefault();

      const time = selectedTimeInput.value;
      if (!time) {
        alert("Por favor, selecione um horário clicando nas opções.");
        return;
      }

      const name = document.getElementById("clientName").value.trim();
      const phone = document.getElementById("clientPhone").value.trim();
      const service = document.getElementById("serviceSelect").value;
      const date = dateInput.value.split("-").reverse().join("/");

      // Formata mensagem amigável
      const msg = `Fala! Gostaria de agendar um horário na barbearia:\n\n` +
                  `👤 *Cliente:* ${name}\n` +
                  `📱 *Telefone:* ${phone}\n` +
                  `✂️ *Serviço:* ${service}\n` +
                  `📅 *Data:* ${date}\n` +
                  `⏰ *Horário:* ${time}\n\n` +
                  `Pode confirmar para mim? Valeu!`;

      // Redireciona para o WhatsApp
      const url = `https://wa.me/${BARBER_WHATSAPP}?text=${encodeURIComponent(msg)}`;
      window.open(url, "_blank");
    });
  </script>
</body>
</html>
